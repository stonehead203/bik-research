name: Domestic stock icon sync

on:
  schedule:
    - cron: "15 10 * * 1-5"
    - cron: "30 10 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: Sync mode
        required: true
        default: missing
        type: choice
        options:
          - missing
          - full

permissions:
  contents: write

concurrency:
  group: domestic-stock-icon-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: outputs/requirements.txt

      - name: Install collector dependency
        run: python -m pip install requests

      - name: Select sync mode
        id: mode
        shell: bash
        run: |
          MODE="missing"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MODE="${{ inputs.mode }}"
          elif [[ "${{ github.event.schedule }}" == "30 10 * * 0" ]]; then
            MODE="full"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Sync domestic stock icons
        run: >-
          python outputs/download_domestic_icons.py
          --mode "${{ steps.mode.outputs.mode }}"
          --workers 6
          --delay 0.05

      - name: Commit changed icons
        shell: bash
        run: |
          ICON_CHANGES="$(git status --porcelain -- outputs/domestic_icons ':!outputs/domestic_icons/manifest.json')"
          if [[ -z "$ICON_CHANGES" ]]; then
            git checkout -- outputs/domestic_icons/manifest.json
            echo "No icon changes."
            exit 0
          fi
          git config user.name "bik-research-bot"
          git config user.email "bik-research-bot@users.noreply.github.com"
          git add outputs/domestic_icons
          git commit -m "chore: sync domestic stock icons"
          git push
